version: "3.8"

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dockdb-backend
    restart: always
    ports:
      - "1000:1000"
    env_file:
      - ./server/.env
    volumes:
      - server-data:/app/data
      - server-logs:/app/logs
    networks:
      - dockdb-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dockdb-client
    restart: always
    ports:
      - "5170:5170"
    environment:
      - VITE_API_BASE_URL=http://localhost:1000/api
    depends_on:
      - backend
    networks:
      - dockdb-network

volumes:
  server-data:
  server-logs:

networks:
  dockdb-network:
    driver: bridge
